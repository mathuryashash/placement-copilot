services:
  - type: web
    name: placement-copilot-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: placement-copilot-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://placement-copilot.vercel.app"
      - key: FAKE_LLM
        value: "false"
      - key: LLM_CACHE_DIR
        value: "/tmp/llm_cache"
      - key: HF_HOME
        value: "/tmp/hf_cache"
    healthCheckPath: /health

databases:
  - name: placement-copilot-db
    databaseName: placement_copilot
    user: copilot
    # Note: render.yaml does not support pgvector extension natively.
    # After creating the DB, run: CREATE EXTENSION IF NOT EXISTS vector;
    # See docs/DEPLOY.md for the manual step.
