services:
  db:
    image: pgvector/pgvector:pg17
    container_name: placement-copilot-db
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: placement_copilot
    ports:
      - "18401:5432"
    volumes:
      - placement-copilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d placement_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement-copilot-api
    ports:
      - "18400:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@db:5432/placement_copilot
      CORS_ORIGINS: http://localhost:18402,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - placement-copilot-llm-cache:/app/llm_cache
      - placement-copilot-hf-cache:/app/hf_cache

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement-copilot-frontend
    ports:
      - "18402:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18400
    depends_on:
      - backend

volumes:
  placement-copilot-pgdata:
  placement-copilot-llm-cache:
  placement-copilot-hf-cache:
